name: Auto Preview Release

on:
  push:
    branches:
      - main # Change this to your default branch if it's different (e.g., master)

jobs:
  build-and-release:
  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Delete Existing Pre-release Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="preview"
          
          # Delete the release if it exists
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          
          # Delete the remote tag if it exists
          git push origin --delete "$TAG_NAME" || true

      - name: Create New Pre-release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: preview
          name: "Preview Build (Auto)"
          body: "Automatically updated preview build built from the latest commit on main."
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}